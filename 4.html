<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <title>Tutorijal 1, Zadatak 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2 {
            font-family: Georgia, serif;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 110px;
        }
        progress {
            width: 120px;
        }
        .buttons {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Unos privatnih podataka</h2>

    <div class="form-group">
        <progress value="2" max="5"></progress>
        <span> Korak 2 od 5</span>
    </div>

    <form action="#" method="post">
        <div class="form-group">
            <label for="datum">Datum rođenja:</label>
            <input type="date" id="datum" name="datum">
        </div>

        <div class="form-group">
            <label for="email">Email adresa:</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="buttons">
            <button type="button">&lt;&lt; Nazad</button>
            <button type="submit">Dalje &gt;&gt;</button>
        </div>
    </form>

</body>
</html>
